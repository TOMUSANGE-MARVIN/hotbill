services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-hotbill}
      MARIADB_USER: ${DB_USERNAME:-hotbill}
      MARIADB_PASSWORD: ${DB_PASSWORD:-hotbill_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wireguard:
    build:
      context: ./wireguard
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      WG_SERVER_IP: 10.66.0.1
      WG_LISTEN_PORT: 51820
    ports:
      - "51820:51820/udp"
    volumes:
      - wg_data:/etc/wireguard

  # SSTP VPN terminator — RouterOS-v6 fallback for WireGuard. On by default;
  # set SSTP_ENABLED=false to disable the api/queue provisioning + routing.
  sstp:
    build:
      context: ./sstp
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/ppp:/dev/ppp"
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      SSTP_PORT: 1443
      SSTP_SERVER_IP: 10.67.0.1
    volumes:
      - sstp_data:/var/sstp
    # Exposed on 443 via the Coolify Traefik proxy. RouterOS v6 SSTP clients do
    # NOT send TLS SNI (SNI support landed only in RouterOS 7.15beta10), so we
    # can't route them by hostname. Instead this is the SNI *fallback*: browsers
    # always send SNI (hotbill.app / api.hotbill.app) and keep hitting the
    # website's HTTP routers, while the SNI-less SSTP client falls through to
    # HostSNI(`*`) and is passed through (raw TLS) to this container's :1443.
    # Running on 443 also makes it look like HTTPS, traversing firewalls that
    # block odd ports like 1443.
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.hotbill-sstp.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.hotbill-sstp.entrypoints=https"
      - "traefik.tcp.routers.hotbill-sstp.tls.passthrough=true"
      - "traefik.tcp.routers.hotbill-sstp.priority=1"
      - "traefik.tcp.services.hotbill-sstp.loadbalancer.server.port=1443"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      wireguard:
        condition: service_started
      sstp:
        condition: service_started
    volumes:
      - wg_data:/var/wireguard
      # Shared chap-secrets file for the SSTP (v6) tunnel — rendered by Laravel.
      - sstp_data:/var/sstp
      # Persist uploaded files (blog images) across redeploys.
      - api_storage:/var/www/html/storage/app/public
    environment:
      APP_NAME: ${APP_NAME:-HotBill}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hotbill}
      DB_USERNAME: ${DB_USERNAME:-hotbill}
      DB_PASSWORD: ${DB_PASSWORD:-hotbill_secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      RUN_MIGRATIONS: "true"
      SSTP_ENABLED: ${SSTP_ENABLED:-true}
    ports:
      - "8090:80"

  queue:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    cap_add:
      - NET_ADMIN
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      wireguard:
        condition: service_started
      sstp:
        condition: service_started
    volumes:
      - wg_data:/var/wireguard
      - sstp_data:/var/sstp
    environment:
      APP_NAME: ${APP_NAME:-HotBill}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hotbill}
      DB_USERNAME: ${DB_USERNAME:-hotbill}
      DB_PASSWORD: ${DB_PASSWORD:-hotbill_secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      SSTP_ENABLED: ${SSTP_ENABLED:-true}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3010:3000"

volumes:
  db_data:
  wg_data:
  sstp_data:
  redis_data:
  api_storage:
