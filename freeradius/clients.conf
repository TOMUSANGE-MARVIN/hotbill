# HotBill routers sit behind NAT with changing public IPs, so a single wildcard
# client authorises all of them by a shared secret (substituted by entrypoint.sh).
# Individual routers are identified by NAS-Identifier, not source IP.
client hotbill-routers {
    ipaddr = 0.0.0.0/0
    secret = @@RADIUS_SECRET@@
    require_message_authenticator = no
    nas_type = other
}
